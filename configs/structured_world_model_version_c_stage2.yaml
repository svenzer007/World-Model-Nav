seed: 7

data:
  data_dir: ./dataset
  train_fraction: 0.9
  sequence_length: 20
  stride: 1

model:
  model_type: structured_obstacle_rssm_vc
  model_version: version_c_motion_v2
  num_dynamic_obstacles: 4
  obstacle_feature_dim: 5
  obstacle_embed_dim: 48
  action_vocab_size: 6
  action_embed_dim: 16
  action_cont_dim: 2
  goal_dim: 5
  use_goal: true
  use_lidar: false
  goal_embed_dim: 32
  hidden_dim: 128
  latent_dim: 64
  head_hidden_dim: 128
  dropout: 0.0
  delta_scale: 0.05
  velocity_scale: 1.0

training:
  stage: stage2
  batch_size: 64
  epochs: 16
  learning_rate: 0.00007
  grad_clip_norm: 5.0
  num_workers: 0
  device: auto
  output_dir: ./artifacts/structured_world_model_version_c_stage2
  init_checkpoint: ./artifacts/structured_world_model_version_c_stage1/best.pt
  init_load_optimizer_state: false

rollout:
  enabled: true
  eval_enabled: true
  horizon: 3
  curriculum:
    - {horizon: 3, epochs: 4}
    - {horizon: 5, epochs: 4}
    - {horizon: 7, epochs: 4}
    - {horizon: 9, epochs: 4}

loss_weights:
  lambda_delta: 1.0
  lambda_vel: 0.2
  lambda_consistency: 0.05
  lambda_latent: 0.25
  lambda_rollout: 0.5

sampler:
  enabled: true
  base_weight: 1.0
  event_bonus: 2.0
  risk_bonus: 2.0
  low_clearance_bonus: 1.5
  collision_bonus: 3.0
  stop_downweight: 0.7
  clearance_scale: 1.0
  min_weight: 0.05
  max_weight: 20.0

evaluation:
  threshold: 0.5
  output_path: ./artifacts/structured_world_model_version_c_stage2/eval_metrics.json
  action_cont_values:
    - [0.0, 0.0]
    - [0.4, 0.0]
    - [0.4, 1.0]
    - [0.4, -1.0]
    - [0.15, 1.0]
    - [0.15, -1.0]
